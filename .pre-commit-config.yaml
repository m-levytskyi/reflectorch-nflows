repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: ./.venv/bin/python -m ruff format
        language: system
        files: ^(reflectorch|tests)/.*\.py$
        types_or: [python, pyi]

      - id: ruff-check
        name: ruff check
        entry: ./.venv/bin/python -m ruff check --fix
        language: system
        files: ^(reflectorch|tests)/.*\.py$
        types_or: [python, pyi]

      - id: pytest-unit
        name: pytest unit
        entry: ./.venv/bin/python -m pytest -q tests/unit
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      - id: ty-check
        name: ty check
        entry: ./.venv/bin/ty check reflectorch tests
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
